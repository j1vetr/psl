<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500" style="background: linear-gradient(135deg, #1a1a1a 0%, #0a0a0a 100%);">
  <defs>
    <linearGradient id="setupGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4a5568;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#2d3748;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a202c;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="electricFlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00D4FF;stop-opacity:0" />
      <stop offset="50%" style="stop-color:#00D4FF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00FFFF;stop-opacity:0" />
    </linearGradient>
    <filter id="setupGlow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge> 
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="cablePattern" patternUnits="userSpaceOnUse" width="10" height="10">
      <rect width="10" height="10" fill="#2d3748"/>
      <circle cx="5" cy="5" r="1" fill="#00D4FF"/>
    </pattern>
  </defs>
  
  <!-- Ground/Site -->
  <rect x="0" y="450" width="600" height="50" fill="#2d3748" opacity="0.8"/>
  <rect x="0" y="430" width="600" height="20" fill="#4a5568" opacity="0.6"/>
  
  <!-- Mobile Generator Van -->
  <rect x="50" y="350" width="180" height="80" rx="6" fill="url(#setupGradient)" stroke="#00D4FF" stroke-width="2"/>
  <rect x="170" y="310" width="60" height="60" rx="4" fill="url(#setupGradient)" stroke="#00D4FF" stroke-width="2"/>
  
  <!-- Generator Unit -->
  <rect x="70" y="320" width="120" height="30" rx="3" fill="#2d3748" stroke="#00FFFF" stroke-width="2"/>
  
  <!-- Van Wheels -->
  <circle cx="80" cy="420" r="15" fill="#2d3748" stroke="#00D4FF" stroke-width="2"/>
  <circle cx="80" cy="420" r="10" fill="#1a202c"/>
  <circle cx="140" cy="420" r="15" fill="#2d3748" stroke="#00D4FF" stroke-width="2"/>
  <circle cx="140" cy="420" r="10" fill="#1a202c"/>
  <circle cx="200" cy="420" r="15" fill="#2d3748" stroke="#00D4FF" stroke-width="2"/>
  <circle cx="200" cy="420" r="10" fill="#1a202c"/>
  
  <!-- Technician Figure -->
  <circle cx="280" cy="390" r="8" fill="#f7fafc" stroke="#00D4FF" stroke-width="1"/>
  <rect x="276" y="398" width="8" height="15" rx="2" fill="#4a5568" stroke="#00D4FF" stroke-width="1"/>
  <rect x="274" y="413" width="12" height="20" rx="2" fill="#2d3748" stroke="#00D4FF" stroke-width="1"/>
  
  <!-- Technician Arms (working) -->
  <line x1="280" y1="405" x2="295" y2="415" stroke="#4a5568" stroke-width="3" stroke-linecap="round"/>
  <line x1="280" y1="405" x2="265" y2="410" stroke="#4a5568" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Tool in Hand -->
  <rect x="262" y="408" width="8" height="3" rx="1" fill="#FFD700" stroke="#00D4FF" stroke-width="1"/>
  
  <!-- Hard Hat -->
  <circle cx="280" cy="385" r="10" fill="#FFD700" stroke="#00D4FF" stroke-width="1"/>
  
  <!-- Power Distribution Box -->
  <rect x="320" y="380" width="60" height="50" rx="4" fill="#2d3748" stroke="#00FFFF" stroke-width="2"/>
  <rect x="325" y="385" width="50" height="40" rx="2" fill="#1a202c"/>
  
  <!-- Distribution Box Controls -->
  <rect x="330" y="390" width="15" height="8" rx="1" fill="#00D4FF" stroke="#00FFFF" stroke-width="1"/>
  <rect x="350" y="390" width="15" height="8" rx="1" fill="#00D4FF" stroke="#00FFFF" stroke-width="1"/>
  <rect x="330" y="405" width="15" height="8" rx="1" fill="#00D4FF" stroke="#00FFFF" stroke-width="1"/>
  <rect x="350" y="405" width="15" height="8" rx="1" fill="#00D4FF" stroke="#00FFFF" stroke-width="1"/>
  
  <!-- Status LEDs on Distribution Box -->
  <circle cx="335" cy="420" r="2" fill="#00FF00" filter="url(#setupGlow)"/>
  <circle cx="343" cy="420" r="2" fill="#FFD700" filter="url(#setupGlow)"/>
  <circle cx="351" cy="420" r="2" fill="#00D4FF" filter="url(#setupGlow)"/>
  <circle cx="359" cy="420" r="2" fill="#00FF00" filter="url(#setupGlow)"/>
  
  <!-- Main Power Cable -->
  <path d="M190,335 Q220,320 250,330 Q280,340 320,390" stroke="#00D4FF" stroke-width="6" fill="none" filter="url(#setupGlow)"/>
  <path d="M190,335 Q220,320 250,330 Q280,340 320,390" stroke="url(#cablePattern)" stroke-width="4" fill="none"/>
  
  <!-- Secondary Cables -->
  <path d="M380,390 Q420,380 450,390 Q480,400 520,380" stroke="#00FFFF" stroke-width="4" fill="none" filter="url(#setupGlow)"/>
  <path d="M380,400 Q420,410 460,400 Q500,390 540,400" stroke="#00D4FF" stroke-width="4" fill="none" filter="url(#setupGlow)"/>
  
  <!-- Equipment Being Powered -->
  <!-- Stage Light -->
  <rect x="480" y="360" width="40" height="20" rx="3" fill="#2d3748" stroke="#00D4FF" stroke-width="2"/>
  <circle cx="500" cy="365" r="8" fill="#FFD700" filter="url(#setupGlow)"/>
  <path d="M492,357 L508,357 L508,373 L492,373 Z" stroke="#FFD700" stroke-width="1" fill="none"/>
  
  <!-- Audio Equipment -->
  <rect x="520" y="380" width="30" height="25" rx="3" fill="#2d3748" stroke="#00FFFF" stroke-width="2"/>
  <rect x="525" y="385" width="5" height="15" rx="1" fill="#00D4FF"/>
  <rect x="535" y="385" width="5" height="15" rx="1" fill="#00D4FF"/>
  <rect x="545" y="385" width="3" height="15" rx="1" fill="#00D4FF"/>
  
  <!-- Extension Cables -->
  <path d="M380,410 Q400,420 420,410" stroke="#00D4FF" stroke-width="3" fill="none"/>
  <path d="M420,410 Q440,400 460,410" stroke="#00FFFF" stroke-width="3" fill="none"/>
  
  <!-- Safety Cones -->
  <polygon points="100,430 105,445 95,445" fill="#FF6600" stroke="#ffffff" stroke-width="1"/>
  <polygon points="160,430 165,445 155,445" fill="#FF6600" stroke="#ffffff" stroke-width="1"/>
  <polygon points="360,430 365,445 355,445" fill="#FF6600" stroke="#ffffff" stroke-width="1"/>
  
  <!-- Warning Signs -->
  <rect x="240" y="420" width="25" height="25" rx="2" fill="#FFD700" stroke="#000000" stroke-width="2"/>
  <text x="252" y="437" font-family="Arial" font-size="12" fill="#000000" text-anchor="middle" font-weight="bold">!</text>
  
  <!-- Cable Management -->
  <rect x="300" y="440" width="30" height="8" rx="2" fill="#4a5568" stroke="#00D4FF" stroke-width="1"/>
  <text x="315" y="447" font-family="Arial" font-size="6" fill="#00D4FF" text-anchor="middle">KABLO</text>
  
  <!-- Setup Timer/Clock -->
  <rect x="420" y="320" width="40" height="30" rx="3" fill="#1a202c" stroke="#00D4FF" stroke-width="2"/>
  <circle cx="440" cy="330" r="10" fill="#000000" stroke="#00FFFF" stroke-width="1"/>
  <text x="440" y="335" font-family="monospace" font-size="8" fill="#00D4FF" text-anchor="middle">08:45</text>
  <text x="440" y="345" font-family="Arial" font-size="6" fill="#00FFFF" text-anchor="middle">KURULUM</text>
  
  <!-- Power Flow Indicators -->
  <circle cx="250" cy="330" r="3" fill="#00D4FF" filter="url(#setupGlow)">
    <animate attributeName="opacity" values="0.3;1;0.3" dur="1s" repeatCount="indefinite"/>
  </circle>
  <circle cx="280" cy="340" r="3" fill="#00FFFF" filter="url(#setupGlow)">
    <animate attributeName="opacity" values="1;0.3;1" dur="1s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Ground Connection -->
  <rect x="110" y="430" width="6" height="20" rx="1" fill="#4a5568" stroke="#00D4FF" stroke-width="1"/>
  <path d="M110,450 L116,450 M111,452 L115,452 M112,454 L114,454" stroke="#00D4FF" stroke-width="1"/>
  
  <!-- Setup Progress Indicator -->
  <rect x="450" y="280" width="120" height="60" rx="5" fill="#1a202c" stroke="#00D4FF" stroke-width="2" opacity="0.95"/>
  <text x="510" y="300" font-family="Arial" font-size="12" fill="#00D4FF" text-anchor="middle" font-weight="bold">KURULUM</text>
  <text x="510" y="315" font-family="Arial" font-size="12" fill="#00D4FF" text-anchor="middle" font-weight="bold">DURUMU</text>
  
  <!-- Progress Steps -->
  <circle cx="460" cy="325" r="3" fill="#00FF00" stroke="#ffffff" stroke-width="1"/>
  <text x="470" y="328" font-family="Arial" font-size="8" fill="#00FF00">Konumlama ✓</text>
  
  <circle cx="460" cy="335" r="3" fill="#FFD700" stroke="#ffffff" stroke-width="1">
    <animate attributeName="fill" values="#FFD700;#00FF00;#FFD700" dur="2s" repeatCount="indefinite"/>
  </circle>
  <text x="470" y="338" font-family="Arial" font-size="8" fill="#FFD700">Bağlantı...</text>
  
  <!-- Title and Description -->
  <text x="300" y="40" font-family="Arial" font-size="20" fill="#00D4FF" text-anchor="middle" font-weight="bold">KURULUM SÜRECİ</text>
  <text x="300" y="60" font-family="Arial" font-size="12" fill="#00FFFF" text-anchor="middle">Profesyonel Kurulum - 10 Dakikadan Az</text>
  
  <!-- Setup Time Counter -->
  <rect x="50" y="280" width="100" height="50" rx="5" fill="#1a202c" stroke="#00D4FF" stroke-width="2" opacity="0.95"/>
  <text x="100" y="300" font-family="Arial" font-size="12" fill="#00D4FF" text-anchor="middle" font-weight="bold">SÜRE</text>
  <text x="100" y="320" font-family="monospace" font-size="16" fill="#00FFFF" text-anchor="middle" font-weight="bold">08:45</text>
  <text x="100" y="335" font-family="Arial" font-size="8" fill="#00FF00" text-anchor="middle">/ 10:00 dk</text>
  
  <!-- Electric Flow Animation -->
  <path d="M50,100 Q150,80 250,100 Q350,120 450,100 Q550,80 600,100" stroke="url(#electricFlow)" stroke-width="2" fill="none" opacity="0.6">
    <animate attributeName="stroke-dasharray" values="0,1000;1000,0;0,1000" dur="3s" repeatCount="indefinite"/>
  </path>
  
  <!-- Safety Badge -->
  <rect x="20" y="200" width="80" height="60" rx="5" fill="#1a202c" stroke="#00D4FF" stroke-width="2" opacity="0.95"/>
  <text x="60" y="220" font-family="Arial" font-size="10" fill="#00D4FF" text-anchor="middle" font-weight="bold">GÜVENLİK</text>
  <text x="60" y="235" font-family="Arial" font-size="8" fill="#00FFFF" text-anchor="middle">• Uzman Ekip</text>
  <text x="60" y="245" font-family="Arial" font-size="8" fill="#00FFFF" text-anchor="middle">• Standart Test</text>
  <text x="60" y="255" font-family="Arial" font-size="8" fill="#00FFFF" text-anchor="middle">• Sertifika</text>
</svg>
