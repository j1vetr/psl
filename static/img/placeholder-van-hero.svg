<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" style="background: linear-gradient(135deg, #1a1a1a 0%, #0a0a0a 100%);">
  <defs>
    <linearGradient id="vanGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2d3748;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a202c;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="electricGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00D4FF;stop-opacity:0" />
      <stop offset="50%" style="stop-color:#00D4FF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00FFFF;stop-opacity:0" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge> 
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Road/Ground -->
  <rect x="0" y="500" width="800" height="100" fill="#2d3748" opacity="0.8"/>
  <rect x="0" y="480" width="800" height="20" fill="#4a5568" opacity="0.6"/>
  
  <!-- Van Body -->
  <rect x="150" y="350" width="400" height="150" rx="10" fill="url(#vanGradient)" stroke="#00D4FF" stroke-width="2"/>
  
  <!-- Van Cabin -->
  <rect x="450" y="280" width="120" height="120" rx="8" fill="url(#vanGradient)" stroke="#00D4FF" stroke-width="2"/>
  
  <!-- Windshield -->
  <rect x="460" y="290" width="100" height="80" rx="5" fill="#1a202c" stroke="#00FFFF" stroke-width="1" opacity="0.8"/>
  
  <!-- Generator Unit (on top) -->
  <rect x="200" y="300" width="200" height="50" rx="5" fill="#2d3748" stroke="#00D4FF" stroke-width="2"/>
  <rect x="220" y="310" width="50" height="30" rx="3" fill="#4a5568" stroke="#00FFFF" stroke-width="1"/>
  <rect x="290" y="310" width="80" height="30" rx="3" fill="#4a5568" stroke="#00FFFF" stroke-width="1"/>
  
  <!-- Wheels -->
  <circle cx="220" cy="480" r="30" fill="#2d3748" stroke="#00D4FF" stroke-width="2"/>
  <circle cx="220" cy="480" r="20" fill="#1a202c"/>
  <circle cx="220" cy="480" r="10" fill="#4a5568"/>
  
  <circle cx="380" cy="480" r="30" fill="#2d3748" stroke="#00D4FF" stroke-width="2"/>
  <circle cx="380" cy="480" r="20" fill="#1a202c"/>
  <circle cx="380" cy="480" r="10" fill="#4a5568"/>
  
  <circle cx="490" cy="480" r="30" fill="#2d3748" stroke="#00D4FF" stroke-width="2"/>
  <circle cx="490" cy="480" r="20" fill="#1a202c"/>
  <circle cx="490" cy="480" r="10" fill="#4a5568"/>
  
  <!-- Electric Cables -->
  <path d="M300,350 Q320,330 340,350 Q360,370 380,350" stroke="#00D4FF" stroke-width="3" fill="none" filter="url(#glow)"/>
  <path d="M250,370 Q270,350 290,370 Q310,390 330,370" stroke="#00FFFF" stroke-width="2" fill="none" filter="url(#glow)"/>
  
  <!-- Power Outlets -->
  <rect x="160" y="380" width="15" height="10" rx="2" fill="#00D4FF" stroke="#00FFFF" stroke-width="1"/>
  <rect x="180" y="380" width="15" height="10" rx="2" fill="#00D4FF" stroke="#00FFFF" stroke-width="1"/>
  <rect x="200" y="380" width="15" height="10" rx="2" fill="#00D4FF" stroke="#00FFFF" stroke-width="1"/>
  
  <!-- Company Logo Area -->
  <rect x="470" y="320" width="80" height="30" rx="3" fill="#1a202c" stroke="#00D4FF" stroke-width="1" opacity="0.8"/>
  <text x="510" y="340" font-family="Arial, sans-serif" font-size="12" fill="#00D4FF" text-anchor="middle" font-weight="bold">PSL</text>
  
  <!-- Electric Energy Lines -->
  <path d="M100,200 Q200,180 300,200 Q400,220 500,200 Q600,180 700,200" stroke="url(#electricGlow)" stroke-width="2" fill="none" opacity="0.6">
    <animate attributeName="stroke-dasharray" values="0,1000;1000,0;0,1000" dur="3s" repeatCount="indefinite"/>
  </path>
  
  <path d="M100,250 Q250,230 400,250 Q550,270 700,250" stroke="url(#electricGlow)" stroke-width="1.5" fill="none" opacity="0.4">
    <animate attributeName="stroke-dasharray" values="1000,0;0,1000;1000,0" dur="4s" repeatCount="indefinite"/>
  </path>
  
  <!-- Generator Exhaust -->
  <path d="M350,300 Q355,280 360,300 Q365,280 370,300" stroke="#4a5568" stroke-width="2" fill="none" opacity="0.6"/>
  
  <!-- Headlights -->
  <circle cx="565" cy="330" r="8" fill="#FFD700" filter="url(#glow)" opacity="0.8"/>
  <circle cx="565" cy="350" r="8" fill="#FFD700" filter="url(#glow)" opacity="0.8"/>
  
  <!-- Side Mirror -->
  <rect x="450" y="300" width="8" height="5" rx="2" fill="#2d3748" stroke="#00D4FF" stroke-width="1"/>
  
  <!-- Generator Control Panel -->
  <rect x="240" y="315" width="20" height="20" rx="2" fill="#1a202c" stroke="#00FFFF" stroke-width="1"/>
  <circle cx="248" cy="320" r="2" fill="#00FF00"/>
  <circle cx="252" cy="320" r="2" fill="#FF0000"/>
  <circle cx="248" cy="325" r="2" fill="#FFD700"/>
  <circle cx="252" cy="325" r="2" fill="#00D4FF"/>
  
  <!-- Safety Stripes -->
  <rect x="150" y="420" width="400" height="5" fill="#FFD700" opacity="0.8"/>
  <rect x="150" y="430" width="400" height="5" fill="#FF0000" opacity="0.8"/>
  
  <!-- Emergency Equipment -->
  <rect x="520" y="380" width="20" height="15" rx="2" fill="#FF0000" stroke="#ffffff" stroke-width="1"/>
  <text x="530" y="390" font-family="Arial, sans-serif" font-size="8" fill="#ffffff" text-anchor="middle">EXT</text>
  
  <!-- Title Text -->
  <text x="400" y="100" font-family="Arial, sans-serif" font-size="28" fill="#00D4FF" text-anchor="middle" font-weight="bold">PSL MOBİL ENERJİ</text>
  <text x="400" y="130" font-family="Arial, sans-serif" font-size="16" fill="#00FFFF" text-anchor="middle">Araç Üstü Mobil Jeneratör</text>
  <text x="400" y="150" font-family="Arial, sans-serif" font-size="14" fill="#ffffff" text-anchor="middle" opacity="0.8">Sahada Kesintisiz Güç</text>
  
  <!-- Power Rating -->
  <rect x="30" y="380" width="80" height="40" rx="5" fill="#1a202c" stroke="#00D4FF" stroke-width="2" opacity="0.9"/>
  <text x="70" y="395" font-family="Arial, sans-serif" font-size="12" fill="#00D4FF" text-anchor="middle" font-weight="bold">250 kVA</text>
  <text x="70" y="410" font-family="Arial, sans-serif" font-size="10" fill="#00FFFF" text-anchor="middle">MAX POWER</text>
  
  <!-- Noise Level Indicator -->
  <rect x="690" y="380" width="80" height="40" rx="5" fill="#1a202c" stroke="#00D4FF" stroke-width="2" opacity="0.9"/>
  <text x="730" y="395" font-family="Arial, sans-serif" font-size="12" fill="#00D4FF" text-anchor="middle" font-weight="bold">&lt; 60 dB</text>
  <text x="730" y="410" font-family="Arial, sans-serif" font-size="10" fill="#00FFFF" text-anchor="middle">SESSİZ</text>
</svg>
