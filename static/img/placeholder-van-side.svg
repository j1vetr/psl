<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" style="background: linear-gradient(135deg, #1a1a1a 0%, #0a0a0a 100%);">
  <defs>
    <linearGradient id="vanBodyGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4a5568;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#2d3748;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a202c;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="electricBlue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00D4FF;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#00FFFF;stop-opacity:0.8" />
    </linearGradient>
    <filter id="electricGlow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge> 
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Ground -->
  <rect x="0" y="350" width="600" height="50" fill="#2d3748" opacity="0.6"/>
  
  <!-- Van Main Body -->
  <rect x="80" y="250" width="350" height="100" rx="8" fill="url(#vanBodyGradient)" stroke="#00D4FF" stroke-width="2"/>
  
  <!-- Van Cabin -->
  <rect x="430" y="220" width="90" height="80" rx="6" fill="url(#vanBodyGradient)" stroke="#00D4FF" stroke-width="2"/>
  
  <!-- Generator Box (External) -->
  <rect x="120" y="200" width="220" height="50" rx="5" fill="#2d3748" stroke="#00FFFF" stroke-width="2"/>
  
  <!-- Generator Vents -->
  <rect x="130" y="210" width="15" height="30" rx="2" fill="#1a202c" stroke="#00D4FF" stroke-width="1"/>
  <rect x="150" y="210" width="15" height="30" rx="2" fill="#1a202c" stroke="#00D4FF" stroke-width="1"/>
  <rect x="170" y="210" width="15" height="30" rx="2" fill="#1a202c" stroke="#00D4FF" stroke-width="1"/>
  
  <!-- Control Panel -->
  <rect x="280" y="210" width="40" height="30" rx="3" fill="#1a202c" stroke="#00FFFF" stroke-width="2"/>
  
  <!-- Status LEDs -->
  <circle cx="285" cy="220" r="2" fill="#00FF00" filter="url(#electricGlow)"/>
  <circle cx="290" cy="220" r="2" fill="#FFD700" filter="url(#electricGlow)"/>
  <circle cx="295" cy="220" r="2" fill="#FF0000"/>
  <circle cx="300" cy="220" r="2" fill="#00D4FF" filter="url(#electricGlow)"/>
  
  <!-- Digital Display -->
  <rect x="285" y="225" width="25" height="10" rx="1" fill="#000000" stroke="#00D4FF" stroke-width="1"/>
  <text x="297" y="232" font-family="monospace" font-size="6" fill="#00D4FF" text-anchor="middle">250kVA</text>
  
  <!-- Emergency Stop Button -->
  <circle cx="310" cy="225" r="5" fill="#FF0000" stroke="#ffffff" stroke-width="1"/>
  <text x="310" y="228" font-family="Arial" font-size="4" fill="#ffffff" text-anchor="middle">STOP</text>
  
  <!-- Wheels -->
  <circle cx="140" cy="340" r="25" fill="#2d3748" stroke="#00D4FF" stroke-width="2"/>
  <circle cx="140" cy="340" r="15" fill="#1a202c"/>
  <circle cx="140" cy="340" r="8" fill="#4a5568"/>
  
  <circle cx="280" cy="340" r="25" fill="#2d3748" stroke="#00D4FF" stroke-width="2"/>
  <circle cx="280" cy="340" r="15" fill="#1a202c"/>
  <circle cx="280" cy="340" r="8" fill="#4a5568"/>
  
  <circle cx="450" cy="340" r="25" fill="#2d3748" stroke="#00D4FF" stroke-width="2"/>
  <circle cx="450" cy="340" r="15" fill="#1a202c"/>
  <circle cx="450" cy="340" r="8" fill="#4a5568"/>
  
  <!-- Windshield -->
  <rect x="440" y="230" width="70" height="50" rx="4" fill="#1a202c" stroke="#00FFFF" stroke-width="1" opacity="0.7"/>
  
  <!-- Side Window -->
  <rect x="440" y="240" width="20" height="30" rx="2" fill="#1a202c" stroke="#00D4FF" stroke-width="1" opacity="0.5"/>
  
  <!-- Headlights -->
  <circle cx="515" cy="245" r="6" fill="#FFD700" filter="url(#electricGlow)"/>
  <circle cx="515" cy="260" r="6" fill="#FFD700" filter="url(#electricGlow)"/>
  
  <!-- Power Cables -->
  <path d="M200,250 Q220,230 240,250 Q260,270 280,250" stroke="#00D4FF" stroke-width="3" fill="none" filter="url(#electricGlow)"/>
  <path d="M160,270 Q180,250 200,270" stroke="#00FFFF" stroke-width="2" fill="none" filter="url(#electricGlow)"/>
  
  <!-- External Power Outlets -->
  <rect x="90" y="270" width="12" height="8" rx="2" fill="#00D4FF" stroke="#00FFFF" stroke-width="1"/>
  <rect x="105" y="270" width="12" height="8" rx="2" fill="#00D4FF" stroke="#00FFFF" stroke-width="1"/>
  <rect x="120" y="270" width="12" height="8" rx="2" fill="#00D4FF" stroke="#00FFFF" stroke-width="1"/>
  
  <!-- Fuel Tank Indicator -->
  <rect x="370" y="270" width="40" height="20" rx="3" fill="#2d3748" stroke="#00D4FF" stroke-width="1"/>
  <rect x="375" y="275" width="30" height="10" rx="2" fill="#1a202c"/>
  <rect x="377" y="277" width="20" height="6" rx="1" fill="#00FF00"/>
  <text x="385" y="295" font-family="Arial" font-size="8" fill="#00D4FF" text-anchor="middle">FUEL</text>
  
  <!-- Company Branding -->
  <rect x="350" y="260" width="60" height="20" rx="3" fill="#1a202c" stroke="#00D4FF" stroke-width="1" opacity="0.9"/>
  <text x="380" y="272" font-family="Arial" font-size="10" fill="#00D4FF" text-anchor="middle" font-weight="bold">PSL</text>
  <text x="380" y="283" font-family="Arial" font-size="6" fill="#00FFFF" text-anchor="middle">MOBİL ENERJİ</text>
  
  <!-- Exhaust Pipe -->
  <rect x="340" y="180" width="8" height="20" rx="4" fill="#4a5568" stroke="#00D4FF" stroke-width="1"/>
  <ellipse cx="344" cy="175" rx="4" ry="2" fill="#4a5568"/>
  
  <!-- Exhaust Smoke/Steam -->
  <circle cx="344" cy="165" r="3" fill="#ffffff" opacity="0.3"/>
  <circle cx="346" cy="155" r="4" fill="#ffffff" opacity="0.2"/>
  <circle cx="348" cy="145" r="5" fill="#ffffff" opacity="0.1"/>
  
  <!-- Safety Equipment -->
  <rect x="480" y="280" width="15" height="10" rx="2" fill="#FF0000" stroke="#ffffff" stroke-width="1"/>
  <text x="487" y="287" font-family="Arial" font-size="5" fill="#ffffff" text-anchor="middle">EXT</text>
  
  <!-- Stabilizer Legs -->
  <rect x="70" y="340" width="15" height="25" rx="2" fill="#4a5568" stroke="#00D4FF" stroke-width="1"/>
  <rect x="440" y="340" width="15" height="25" rx="2" fill="#4a5568" stroke="#00D4FF" stroke-width="1"/>
  
  <!-- Technical Specifications Box -->
  <rect x="20" y="30" width="120" height="80" rx="5" fill="#1a202c" stroke="url(#electricBlue)" stroke-width="2" opacity="0.95"/>
  <text x="80" y="50" font-family="Arial" font-size="12" fill="#00D4FF" text-anchor="middle" font-weight="bold">TEKNİK</text>
  <text x="80" y="65" font-family="Arial" font-size="12" fill="#00D4FF" text-anchor="middle" font-weight="bold">ÖZELLİKLER</text>
  <text x="25" y="80" font-family="Arial" font-size="8" fill="#00FFFF">• 250 kVA Güç</text>
  <text x="25" y="92" font-family="Arial" font-size="8" fill="#00FFFF">• &lt; 60 dB Ses</text>
  <text x="25" y="104" font-family="Arial" font-size="8" fill="#00FFFF">• Euro 5 Emisyon</text>
  
  <!-- Performance Indicator -->
  <rect x="460" y="30" width="120" height="80" rx="5" fill="#1a202c" stroke="url(#electricBlue)" stroke-width="2" opacity="0.95"/>
  <text x="520" y="50" font-family="Arial" font-size="12" fill="#00D4FF" text-anchor="middle" font-weight="bold">PERFORMANS</text>
  <text x="465" y="65" font-family="Arial" font-size="8" fill="#00FFFF">Yakıt Tüketimi:</text>
  <text x="465" y="75" font-family="Arial" font-size="8" fill="#00FF00">15 L/saat</text>
  <text x="465" y="88" font-family="Arial" font-size="8" fill="#00FFFF">Çalışma Süresi:</text>
  <text x="465" y="98" font-family="Arial" font-size="8" fill="#00FF00">16 saat</text>
  
  <!-- Side View Label -->
  <text x="300" y="180" font-family="Arial" font-size="14" fill="#00D4FF" text-anchor="middle" font-weight="bold">YAN GÖRÜNÜŞ</text>
  <text x="300" y="195" font-family="Arial" font-size="10" fill="#00FFFF" text-anchor="middle">Araç Üstü Mobil Jeneratör Sistemi</text>
  
  <!-- Electric Effects -->
  <path d="M100,120 Q200,100 300,120 Q400,140 500,120" stroke="url(#electricBlue)" stroke-width="1.5" fill="none" opacity="0.6">
    <animate attributeName="stroke-dasharray" values="0,500;500,0;0,500" dur="3s" repeatCount="indefinite"/>
  </path>
</svg>
