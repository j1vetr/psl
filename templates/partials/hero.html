<section class="relative min-h-screen flex items-center justify-center overflow-hidden futuristic-hero">
    <!-- Futuristic Background Setup -->
    <div class="absolute inset-0 bg-cover bg-center bg-no-repeat" style="background-image: url('{{ url_for('static', filename='img/hero-van.jpeg') }}')">
        <!-- Advanced Dark Overlay with Gradient -->
        <div class="absolute inset-0 bg-gradient-to-br from-black/90 via-black/70 to-electric-dark/60"></div>
        
        <!-- Futuristic Grid Overlay -->
        <div class="absolute inset-0 opacity-10">
            <div class="futuristic-grid"></div>
        </div>
        
        <!-- Advanced Electric Field Animation -->
        <div class="absolute inset-0 electric-field-container">
            <svg class="w-full h-full" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg">
                <defs>
                    <linearGradient id="goldElectric" x1="0%" y1="0%" x2="100%" y2="0%">
                        <stop offset="0%" style="stop-color:#FFD700;stop-opacity:0" />
                        <stop offset="25%" style="stop-color:#FFD700;stop-opacity:0.6" />
                        <stop offset="50%" style="stop-color:#FFA500;stop-opacity:1" />
                        <stop offset="75%" style="stop-color:#FFD700;stop-opacity:0.6" />
                        <stop offset="100%" style="stop-color:#FFA500;stop-opacity:0" />
                    </linearGradient>
                    <filter id="futuristicGlow" x="-50%" y="-50%" width="200%" height="200%">
                        <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
                        <feMerge> 
                            <feMergeNode in="coloredBlur"/>
                            <feMergeNode in="SourceGraphic"/>
                        </feMerge>
                    </filter>
                </defs>
                <!-- Dynamic Power Circuit Lines -->
                <g class="power-circuit">
                    <!-- Main horizontal circuit -->
                    <path d="M0,400 L300,400 L350,350 L400,400 L600,400 L650,450 L700,400 L1200,400 L1300,350 L1500,400 L1920,400" 
                          stroke="url(#goldElectric)" stroke-width="3" fill="none" 
                          stroke-dasharray="50,30" filter="url(#futuristicGlow)" 
                          class="circuit-line-1"/>
                    <!-- Secondary circuit -->
                    <path d="M0,600 L200,600 L250,550 L300,600 L800,600 L850,650 L900,600 L1400,600 L1450,550 L1920,600" 
                          stroke="url(#goldElectric)" stroke-width="2" fill="none" 
                          stroke-dasharray="40,25" filter="url(#futuristicGlow)" 
                          class="circuit-line-2"/>
                    <!-- Vertical connectors -->
                    <path d="M400,400 L400,450 L450,500 L400,550 L400,600" 
                          stroke="#FFD700" stroke-width="2" fill="none" 
                          stroke-dasharray="20,15" opacity="0.8" class="circuit-connector"/>
                    <path d="M900,400 L900,450 L950,500 L900,550 L900,600" 
                          stroke="#FFA500" stroke-width="2" fill="none" 
                          stroke-dasharray="20,15" opacity="0.8" class="circuit-connector"/>
                </g>
                
                <!-- Power Nodes -->
                <g class="power-nodes">
                    <circle cx="400" cy="400" r="6" fill="#FFD700" class="power-node">
                        <animate attributeName="r" values="6;10;6" dur="2s" repeatCount="indefinite"/>
                        <animate attributeName="opacity" values="0.8;1;0.8" dur="2s" repeatCount="indefinite"/>
                    </circle>
                    <circle cx="900" cy="400" r="8" fill="#FFA500" class="power-node">
                        <animate attributeName="r" values="8;12;8" dur="1.5s" repeatCount="indefinite"/>
                        <animate attributeName="opacity" values="0.6;1;0.6" dur="1.5s" repeatCount="indefinite"/>
                    </circle>
                    <circle cx="400" cy="600" r="5" fill="#FFD700" class="power-node">
                        <animate attributeName="r" values="5;8;5" dur="2.5s" repeatCount="indefinite"/>
                        <animate attributeName="opacity" values="0.7;1;0.7" dur="2.5s" repeatCount="indefinite"/>
                    </circle>
                    <circle cx="900" cy="600" r="7" fill="#FFA500" class="power-node">
                        <animate attributeName="r" values="7;11;7" dur="1.8s" repeatCount="indefinite"/>
                        <animate attributeName="opacity" values="0.9;1;0.9" dur="1.8s" repeatCount="indefinite"/>
                    </circle>
                </g>
            </svg>
        </div>
        
        <!-- Floating Energy Orbs -->
        <div class="energy-orbs">
            <div class="energy-orb orb-1"></div>
            <div class="energy-orb orb-2"></div>
            <div class="energy-orb orb-3"></div>
            <div class="energy-orb orb-4"></div>
            <div class="energy-orb orb-5"></div>
        </div>
    </div>
    
    <!-- Main Hero Content Container -->
    <div class="relative z-20 w-full">
        <!-- Top Status Bar -->
        <div class="absolute top-8 left-0 right-0 z-30">
            <div class="container mx-auto px-4">
                <div class="flex justify-between items-center">
                    <!-- Left Status -->
                    <div class="futuristic-panel px-4 py-2">
                        <span class="text-electric-gold text-xs font-mono">SYSTEM: ONLINE</span>
                    </div>
                    <!-- Right Status -->
                    <div class="futuristic-panel px-4 py-2">
                        <span class="text-electric-gold text-xs font-mono">POWER: 250kVA</span>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- Central Content -->
        <div class="flex items-center justify-center min-h-screen px-4">
            <div class="text-center space-y-12 max-w-6xl mx-auto">
                <!-- Main Title with Futuristic Design -->
                <div class="space-y-8" data-aos="fade-up">
                    <!-- Company Identifier -->
                    <div class="futuristic-badge mx-auto">
                        <span class="text-electric-gold font-mono text-sm tracking-wider">PSL MOBİL ENERJİ</span>
                    </div>
                    
                    <!-- Main Headline -->
                    <h1 class="futuristic-title">
                        <span class="title-line-1">SAHADA</span>
                        <span class="title-line-2">KESİNTİSİZ</span>
                        <span class="title-line-3 electric-power-word-v2">GÜÇ</span>
                    </h1>
                    
                    <!-- Subtitle -->
                    <p class="futuristic-subtitle">
                        <span class="subtitle-accent">&gt;</span> 
                        ARAÇ ÜSTÜ MOBİL JENERATÖR İLE HER YERDE ENERJİ
                        <span class="subtitle-accent">&lt;</span>
                    </p>
                </div>
                
                <!-- Action Interface -->
                <div class="space-y-8" data-aos="fade-up" data-aos-delay="300">
                    <!-- Primary Actions -->
                    <div class="flex flex-col lg:flex-row items-center justify-center gap-6">
                        <a href="{{ url_for('iletisim') }}" class="futuristic-btn primary-action">
                            <span class="btn-icon">⚡</span>
                            <span class="btn-text">TEKLİF AL</span>
                            <div class="btn-glow"></div>
                        </a>
                        <a href="tel:+905551234567" class="futuristic-btn secondary-action">
                            <span class="btn-icon">📞</span>
                            <span class="btn-text">HEMEN ARA</span>
                            <div class="btn-glow"></div>
                        </a>
                    </div>
                    
                    <!-- System Stats -->
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-4 max-w-3xl mx-auto">
                        <div class="futuristic-stat-card" data-aos="zoom-in" data-aos-delay="500">
                            <div class="stat-value">&lt; 10 DK</div>
                            <div class="stat-label">KURULUM SÜRESİ</div>
                            <div class="stat-indicator"></div>
                        </div>
                        <div class="futuristic-stat-card" data-aos="zoom-in" data-aos-delay="600">
                            <div class="stat-value">&lt; 60 DB</div>
                            <div class="stat-label">SES SEVİYESİ</div>
                            <div class="stat-indicator"></div>
                        </div>
                        <div class="futuristic-stat-card" data-aos="zoom-in" data-aos-delay="700">
                            <div class="stat-value">7/24</div>
                            <div class="stat-label">TEKNİK DESTEK</div>
                            <div class="stat-indicator"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- Bottom Navigation Indicator -->
        <div class="absolute bottom-8 left-1/2 transform -translate-x-1/2 z-30">
            <div class="futuristic-scroll-indicator">
                <div class="scroll-arrow"></div>
                <span class="scroll-text">SCROLL</span>
            </div>
        </div>
    </div>
</section>
