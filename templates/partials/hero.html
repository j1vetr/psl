<section class="relative min-h-screen flex items-center justify-center overflow-hidden">
    <!-- Background Image with Dark Overlay -->
    <div class="absolute inset-0 bg-cover bg-center bg-no-repeat" style="background-image: url('{{ url_for('static', filename='img/hero-van.jpeg') }}')">
        <!-- Dark Overlay -->
        <div class="absolute inset-0 bg-gradient-to-b from-black/70 via-black/60 to-black/80"></div>
        
        <!-- Subtle Electric Animation -->
        <div class="absolute inset-0 opacity-10">
            <svg class="w-full h-full" viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg">
                <defs>
                    <linearGradient id="subtleElectric" x1="0%" y1="0%" x2="100%" y2="0%">
                        <stop offset="0%" style="stop-color:#FFD700;stop-opacity:0" />
                        <stop offset="50%" style="stop-color:#FFD700;stop-opacity:0.5" />
                        <stop offset="100%" style="stop-color:#FFA500;stop-opacity:0" />
                    </linearGradient>
                </defs>
                <path d="M0,400 Q600,380 1200,400" stroke="url(#subtleElectric)" stroke-width="1" fill="none" 
                      stroke-dasharray="30,20" style="animation: electric-flow 6s linear infinite;"/>
            </svg>
        </div>
    </div>
    
    <!-- Hero Content -->
    <div class="relative z-10 text-center space-y-8 px-4 max-w-4xl mx-auto">
        <!-- Main Headline -->
        <div class="space-y-6" data-aos="fade-up">
            <h1 class="text-4xl md:text-5xl lg:text-6xl font-bold leading-tight text-white">
                Sahada
                <span class="block bg-gradient-to-r from-electric-blue to-electric-cyan bg-clip-text text-transparent">
                    Kesintisiz Güç
                </span>
            </h1>
            <p class="text-lg md:text-xl text-gray-300 font-medium">
                Araç Üstü Mobil Jeneratör ile Her Yerde Enerji
            </p>
        </div>
        
        <!-- CTA Buttons -->
        <div class="flex flex-col sm:flex-row items-center justify-center gap-4" data-aos="fade-up" data-aos-delay="300">
            <a href="{{ url_for('iletisim') }}" 
               class="bg-electric-blue hover:bg-electric-cyan text-electric-dark font-bold px-8 py-4 rounded-full transition-all duration-300 hover:scale-105 hover:shadow-lg hover:shadow-electric-blue/25 flex items-center space-x-2 w-full sm:w-auto">
                <i data-feather="zap" class="w-5 h-5"></i>
                <span>Teklif Al</span>
            </a>
            <a href="tel:+905551234567" 
               class="border-2 border-electric-blue hover:bg-electric-blue text-electric-blue hover:text-electric-dark font-bold px-8 py-4 rounded-full transition-all duration-300 hover:scale-105 flex items-center space-x-2 w-full sm:w-auto">
                <i data-feather="phone" class="w-5 h-5"></i>
                <span>Hemen Ara</span>
            </a>
        </div>
        
        <!-- Info Pills -->
        <div class="flex flex-col sm:flex-row items-center justify-center gap-4 mt-8" data-aos="fade-up" data-aos-delay="500">
            <div class="glass-panel px-4 py-2 rounded-full text-center">
                <span class="text-electric-blue font-semibold text-sm">&lt;10 dk Kurulum</span>
            </div>
            <div class="glass-panel px-4 py-2 rounded-full text-center">
                <span class="text-electric-cyan font-semibold text-sm">&lt;60 dB Sessiz</span>
            </div>
            <div class="glass-panel px-4 py-2 rounded-full text-center">
                <span class="text-electric-blue font-semibold text-sm">7/24 Hizmet</span>
            </div>
        </div>
        
        <!-- Scroll Indicator -->
        <div class="absolute bottom-8 left-1/2 transform -translate-x-1/2 text-white/60 animate-bounce" data-aos="fade-in" data-aos-delay="800">
            <i data-feather="chevron-down" class="w-6 h-6"></i>
        </div>
    </div>
</section>
